services:
  bot:
    build: .
    container_name: savebot
    restart: always
    env_file: .env
    volumes:
      - bot-data:/app/data          # baza (foydalanuvchilar, statistika, kesh)
      # Local Bot API fayllari (faqat o'qish) — MP3'ni yuborilgan videodan tez olish uchun
      - tg-bot-api:/var/lib/telegram-bot-api:ro
      # - ./cookies.txt:/app/cookies.txt:ro   # Instagram/YouTube cookies (COOKIES_FILE=/app/cookies.txt)
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # 2 GB gacha fayl yuborish uchun o'zingizning Bot API serveringiz.
  # Yoqish: .env da TELEGRAM_API_ID, TELEGRAM_API_HASH va LOCAL_API_URL=http://telegram-bot-api:8081
  # so'ng: docker compose --profile localapi up -d
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["localapi"]
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api:/var/lib/telegram-bot-api

volumes:
  bot-data:
  tg-bot-api:
