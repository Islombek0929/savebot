services:
  bot:
    build: .
    container_name: savebot
    restart: always
    env_file: .env
    volumes:
      - bot-data:/app/data          # baza (foydalanuvchilar, statistika, kesh)
      # Instagram/YouTube cookies: faylni ./cookies/cookies.txt ga qo'ying va botni qayta ishga tushiring
      - ./cookies:/app/cookies:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # 2 GB gacha fayl yuborish uchun o'zingizning Bot API serveringiz.
  # Yoqish: .env da TELEGRAM_API_ID, TELEGRAM_API_HASH va LOCAL_API_URL=http://telegram-bot-api:8081
  # so'ng: docker compose --profile localapi up -d
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["localapi"]
    restart: always
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api:/var/lib/telegram-bot-api

  # YouTube "PO Token" serveri: YouTube video fayliga 403 bersa kerak bo'ladi.
  # Yoqish: .env da COMPOSE_PROFILES=localapi,youtube va POT_PROVIDER_URL=http://pot-provider:4416
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    profiles: ["youtube"]
    restart: always
    init: true

volumes:
  bot-data:
  tg-bot-api:
